name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      # Use one pytest worker per runner vCPU.
      PYTEST_ADDOPTS: "-n logical"
      # Keep numerical libraries from multiplying threads in every worker.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      POSTGKYL_REQUIRE_GKEYLL: "1"
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native Postgkyl and documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          python -m pip install -e '.[docs,test]'
      - name: Test documentation contracts and downloadable examples
        # Keep tests sharing the expensive documentation fixture on one worker.
        run: >-
          python -m pytest --dist=loadscope
          tests/test_documentation.py tests/test_examples.py tests/test_docs_build.py
      - name: Build a reviewable website
        run: |
          python scripts/build_docs.py
          python -m sphinx -W --keep-going -b html -c docs build/docs/source build/docs/html
      - uses: actions/upload-artifact@v7
        with:
          name: postgkyl-docs
          path: build/docs/html
          if-no-files-found: error
      - name: Trigger the live Read the Docs build
        if: >-
          github.repository == 'gkeyllorg/postgkyl' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("READTHEDOCS_TOKEN")
          if not token:
              raise SystemExit(
                  "Configure the Postgkyl repository secret READTHEDOCS_TOKEN "
                  "with permission to build the gkeyll Read the Docs project."
              )
          request = urllib.request.Request(
              "https://app.readthedocs.org/api/v3/projects/gkeyll/versions/latest/builds/",
              method="POST", headers={"Authorization": f"Token {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 202:
                  raise RuntimeError(f"Build trigger returned {response.status}")
              build = json.load(response)["build"]
          print(f"Read the Docs build requested: {build['urls']['build']}")
          PY
