name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Exercise external Chrome/ffmpeg integrations even during quiet weeks.
    - cron: "0 7 * * 1"

# Every job is read-only. In particular, formatting is a check on the source
# commit, never a mutation which is passed on to later jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # pull_request checks run the contributor's exact commit, rather than a
  # synthetic merge commit. The fallbacks cover push and workflow_dispatch.
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORCE_COLOR: "1"
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality (format and lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: python -m pip install pre-commit==4.3.0 ruff==0.12.11
      - name: Validate hooks and check formatting
        run: |
          pre-commit validate-config
          pre-commit run --all-files --show-diff-on-failure
      - name: Lint
        run: ruff check .

  compatibility:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGKYL_SKIP_GKEYLL_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        # The authoritative full suite runs on 3.12 below. This matrix covers
        # the other supported interpreters without repeating costly renderer
        # and native integration tests.
        include:
          - python-version: "3.10"
            numpy: "numpy==2.2.6"
          - python-version: "3.11"
            numpy: "numpy==2.2.6"
          - python-version: "3.13"
            numpy: "numpy==2.2.6"
          # NumPy 2.2 predates Python 3.14 support. Resolve the current NumPy
          # release on this one lane instead of asking pip for no wheel.
          - python-version: "3.14"
            numpy: "numpy"
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Postgkyl and test dependencies
        run: |
          python -m pip install "${{ matrix.numpy }}" setuptools wheel
          python -m pip install --no-build-isolation -e ".[test]"
      - name: Run core tests
        run: >-
          python -m pytest
          -m compatibility
          --strict-config --strict-markers
          --timeout=120

  coverage:
    name: Full suite and branch coverage / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      POSTGKYL_REQUIRE_GKEYLL: "1"
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Postgkyl and test dependencies
        run: |
          python -m pip install "numpy==2.2.6" setuptools wheel
          python -m pip install --no-build-isolation -e ".[test]"
      - name: Start headless display
        uses: pyvista/setup-headless-display-action@v4
      - name: Require the compiled Gkeyll bridge
        run: |
          python - <<'PY'
          from postgkyl import gpython
          gpython.require()
          print(gpython.lib_path())
          PY
      - name: Run full suite with coverage
        run: >-
          python -m pytest
          -m "not external_tool"
          --strict-config --strict-markers
          --timeout=120
          --cov=postgkyl --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=98
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  native_macos:
    name: Native bridge / macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      POSTGKYL_REQUIRE_GKEYLL: "1"
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Postgkyl and test dependencies
        run: |
          python -m pip install "numpy==2.2.6" setuptools wheel
          python -m pip install --no-build-isolation -e ".[test]"
      - name: Require the compiled Gkeyll bridge
        run: |
          python - <<'PY'
          from postgkyl import gpython
          gpython.require()
          print(gpython.lib_path())
          PY
      - name: Run native tests in isolated processes
        # Native-library aborts on macOS should fail one test, not terminate
        # the entire session and hide which test caused the failure.
        run: >-
          python -m pytest
          -m native
          --strict-config --strict-markers
          --timeout=120
          --forked

  renderers:
    name: Renderer integrations / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      POSTGKYL_SKIP_GKEYLL_BUILD: "1"
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Chrome for Kaleido
        if: github.event_name != 'pull_request'
        uses: browser-actions/setup-chrome@v2
      - name: Install Postgkyl and test dependencies
        run: |
          python -m pip install "numpy==2.2.6" setuptools wheel
          python -m pip install --no-build-isolation -e ".[test]"
      - name: Start headless display
        uses: pyvista/setup-headless-display-action@v4
      - name: Verify external renderer tools
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from choreographer.browsers.chromium import Chromium
          from postgkyl.render import _ffmpeg

          chrome = Chromium.find_browser(skip_local=False)
          ffmpeg = _ffmpeg.resolve_ffmpeg()
          if chrome is None:
            raise SystemExit("Chrome/Chromium is required for Kaleido tests")
          if ffmpeg is None:
            raise SystemExit("ffmpeg is required for animation tests")
          print(f"chrome: {chrome}")
          print(f"ffmpeg: {ffmpeg}")
          PY
      - name: Run headless renderer tests
        run: >-
          python -m pytest
          -m "render and not external_tool"
          --strict-config --strict-markers
          --timeout=120
      - name: Run external renderer tests
        if: github.event_name != 'pull_request'
        # These tests launch Chrome and ffmpeg. A separate invocation gives
        # them a firm timeout and an unambiguous failure in the job log.
        run: >-
          python -m pytest
          -m external_tool
          --strict-config --strict-markers
          --timeout=180 --timeout-method=signal

  package:
    name: Build and install distribution artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install artifact tools and build prerequisites
        run: >-
          python -m pip install
          "numpy==2.2.6" setuptools wheel
          build==1.3.0 twine==6.2.0
      - name: Build sdist and wheel from the sdist
        # `python -m build` creates the sdist first and then uses that sdist as
        # the wheel source, testing that no untracked checkout files are needed.
        run: python -m build --no-isolation
      - name: Validate artifact metadata
        run: python -m twine check --strict dist/*
      - name: Remove access to build-time native libraries
        shell: bash
        run: |
          # An absolute RPATH back into the checkout can make a broken wheel
          # appear healthy. Hide the build tree before testing the installed
          # artifact so the wheel must carry/find its own runtime libraries.
          if [ -d "$GITHUB_WORKSPACE/gkeyll" ]; then
            mv "$GITHUB_WORKSPACE/gkeyll" "$RUNNER_TEMP/build-only-gkeyll"
          fi
      - name: Smoke-test the installed wheel outside the checkout
        run: scripts/smoke_wheel.sh dist/*.whl
      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: warn
          retention-days: 14
