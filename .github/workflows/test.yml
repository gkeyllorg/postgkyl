
name: Test Postgkyl

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.3.0
    - name: Install formatter hook environments
      run: |
        pre-commit validate-config
        if ! pre-commit install-hooks; then
          echo "::error title=Formatter installation failed::Pre-commit could not install the YAPF or clang-format hook environment."
          exit 1
        fi
    - name: Apply formatting
      id: format
      shell: bash
      run: |
        # Hooks return 1 when they rewrite a file. The second pass distinguishes
        # that expected result from a formatter/configuration failure.
        pre-commit run --all-files || true
        pre-commit run --all-files --show-diff-on-failure

        if git diff --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
        git diff --binary --output="$RUNNER_TEMP/formatted.patch"
    - name: Store formatted source patch
      uses: actions/upload-artifact@v4
      with:
        name: formatted-source
        path: ${{ runner.temp }}/formatted.patch
        if-no-files-found: error
        retention-days: 1

  install_and_test:
    needs: format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Download formatted source patch
      uses: actions/download-artifact@v4
      with:
        name: formatted-source
        path: ${{ runner.temp }}/formatted-source
    - name: Apply formatted source patch
      shell: bash
      run: |
        patch="$RUNNER_TEMP/formatted-source/formatted.patch"
        if [ -s "$patch" ]; then
          git apply "$patch"
        fi
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install postgkyl
      run: |
        # Pinned, not "--upgrade numpy": floating to whatever's newest on
        # PyPI resolves a *different* NumPy per Python version once upstream
        # drops support for an older interpreter mid-matrix (confirmed: NumPy
        # 2.4/2.5 already require Python >=3.11/>=3.12, so "latest" silently
        # stops matching across 3.10/3.11/3.12 here) -- non-reproducible and
        # untested against the rest of the scientific stack (matplotlib's
        # contourpy dependency, pyvista/VTK, pytables) on whatever day CI
        # happens to run. Pin to the exact floor pyproject.toml already
        # declares (numpy>=2.2.6) so every Python version in this matrix
        # tests the same, already-vetted NumPy release; bump both together.
        pip install "numpy==2.2.6" setuptools wheel
        pip install -e .[test] --no-build-isolation
    - uses: pyvista/setup-headless-display-action@v4
    - name: Test with pytest
      run: |
        # macOS only: --forked (pytest-forked, installed via pyproject.toml's
        # sys_platform=='darwin' marker) runs each test in its own forked
        # process, so a native-library abort in a compiled dependency
        # (matplotlib/FreeType, VTK, ...) -- observed repeatedly on macOS CI
        # and never on Linux -- fails just that one test instead of taking
        # down the whole 1700-test session. Skipped on Linux: unneeded there,
        # and forking every test adds real overhead.
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          pytest --forked
        else
          pytest
        fi

  commit_formatting:
    name: Commit formatting
    needs:
      - format
      - install_and_test
    if: >-
      needs.format.outputs.changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Download formatted source patch
      uses: actions/download-artifact@v4
      with:
        name: formatted-source
        path: ${{ runner.temp }}/formatted-source
    - name: Commit and push formatting
      shell: bash
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        git apply "$RUNNER_TEMP/formatted-source/formatted.patch"
        git diff --check
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add --update
        git commit -m "Apply automated formatting"
        git push origin "HEAD:$HEAD_REF"
