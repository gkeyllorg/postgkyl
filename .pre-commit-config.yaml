minimum_pre_commit_version: "4.3.0"

repos:
  # Generated before the checks below so they also see the regenerated stub.
  # It imports postgkyl, so run pre-commit from the environment with the
  # editable install.
  - repo: local
    hooks:
      - id: session-stub
        name: regenerate PostgkylSession stub
        entry: python scripts/generate_session_stub.py
        language: system
        pass_filenames: false
        files: ^(src/postgkyl/.*\.pyi?|scripts/generate_session_stub\.py)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check

  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        # marimo owns the notebook's formatting and rewrites it on every edit.
        exclude: ^src/postgkyl/gui/notebook\.py$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]
